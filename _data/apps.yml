- name: PixPerfect – Inpaint with AI
  description: >-
    I built and shipped an on-device AI photo editor for object removal,
    powered by Core ML and Vision. It has a freehand brush, a precision
    loupe, lasso selection, AI object detection and segmentation, and
    background reconstruction — plus undo/redo, mosaic, and full-resolution
    export. Everything runs on-device: no uploads, no account required.
  url: https://apps.apple.com/us/app/pixperfect-inpaint-with-ai/id6775405253

- name: CleanShot – AI Photo Cleaner
  description: >-
    I independently designed, built, and shipped an on-device photo-cleanup
    app that detects duplicates, similar images, screenshots, notes, and
    blurry or low-quality photos, with bulk cleanup and full-screen review.
    I cared a lot about the on-device, privacy-first analysis, along with
    quality scoring, scan progress and cancellation, haptics, and
    localization.
  url: https://apps.apple.com/us/app/cleanshot-ai-photo-cleaner/id6775141807

- name: "QuranWords: Flashcard"
  description: >-
    I built and launched a multilingual vocabulary-learning app around
    frequency-ranked Quranic vocabulary, spaced repetition, word-level
    audio, real verse context, and root-word study, with six quiz modes.
    I designed the engagement loop around daily goals, streaks, XP,
    achievements, and reminders — it supports eight app languages and
    multiple Arabic script styles.
  url: https://apps.apple.com/us/app/quranwords-flashcard/id6794572370
